    <style>
      #root:empty {
        background: #f8fafc;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .initial-loader {
        width: 48px;
        height: 48px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #f97316;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .initial-text {
        font-weight: 800;
        color: #1e293b;
        letter-spacing: -0.02em;
        font-size: 14px;
      }
      .initial-subtext {
        font-size: 11px;
        color: #64748b;
        margin-top: 8px;
      }
    </style>

    <div id="root">
      <div class="initial-loader"></div>
      <div class="initial-text">Mani Traveler</div>
      <div class="initial-subtext">Initializing secure adventure ledger...</div>
      <script>
        // Emergency redirection for very old browsers or WebViews that fail modern JS
        setTimeout(function() {
          var root = document.getElementById('root');
          // If the app hasn't hydrated/cleared the root after 8 seconds, it likely crashed
          if (root && root.innerHTML.indexOf('initial-loader') !== -1) {
            root.innerHTML += '<div style="margin-top: 30px; font-size: 10px; color: #f97316; font-weight: bold; text-align: center; max-width: 250px;">App taking too long? Try opening in Google Chrome for the best experience.</div>';
          }
        }, 8000);
      </script>
    </div>
